name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm test
      - name: Build executables
        run: |
          mkdir -p release
          for target in linux-x64 linux-arm64 windows-x64 darwin-x64 darwin-arm64; do
            ext=""; [ "$target" = "windows-x64" ] && ext=".exe"
            bun build src/index.ts --compile --minify --target="bun-$target" --outfile="release/orcabot-$target$ext"
          done
          cp .env.example release/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes
